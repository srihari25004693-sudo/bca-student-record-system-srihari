[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bca-student-record-system-srihari"
version = "0.1.0"
description = "A simple student record system built with Python and SQLite"
readme = "README.txt"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "srihari25004693-sudo" }]

[project.urls]
Homepage = "https://github.com/srihari25004693-sudo/bca-student-record-system-srihari"

[project.scripts]
student-records = "student_records.main:main"

[tool.setuptools.packages.find]
where = ["src"]
